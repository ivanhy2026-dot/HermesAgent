<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tasks</title>
<style>
  :root{
    --bg:#f6f5f3;
    --surface:#ffffff;
    --surface-2:#faf9f7;
    --ink:#1a1a17;
    --ink-soft:#5b5b55;
    --muted:#8a8a82;
    --line:#e7e5e0;
    --line-strong:#d9d6cf;
    --accent:#0f7a64;
    --accent-ink:#0a5b4b;
    --accent-soft:#e6f1ee;
    --danger:#c23b2e;
    --danger-soft:#fbe9e6;
    --shadow:0 1px 2px rgba(20,18,12,.04), 0 12px 32px -12px rgba(20,18,12,.16);
    --radius:14px;
    --ease:cubic-bezier(.2,.7,.2,1);
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#141514;
      --surface:#1d1e1c;
      --surface-2:#242522;
      --ink:#f1f0ec;
      --ink-soft:#a6a49c;
      --muted:#6f6e67;
      --line:#2c2d29;
      --line-strong:#3a3b35;
      --accent:#3fd0a8;
      --accent-ink:#5fe0bd;
      --accent-soft:#193a32;
      --danger:#ff7a6b;
      --danger-soft:#3a1f1b;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 16px 40px -16px rgba(0,0,0,.6);
    }
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    font-size:16px;
    line-height:1.45;
    display:flex;
    justify-content:center;
    padding:48px 16px;
  }
  .app{
    width:100%;
    max-width:600px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    overflow:hidden;
  }

  /* Header */
  .head{
    padding:22px 24px 0;
  }
  .head .row{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:12px;
  }
  .head h1{
    margin:0;
    font-size:26px;
    font-weight:700;
    letter-spacing:-.02em;
  }
  .head .date{
    font-size:13px;
    color:var(--muted);
    font-variant-numeric:tabular-nums;
  }
  .meta{
    margin-top:12px;
    display:flex;
    align-items:center;
    gap:10px;
    font-size:13px;
    color:var(--ink-soft);
  }
  .meta .num{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
  .bar{
    height:5px;
    border-radius:999px;
    background:var(--line);
    overflow:hidden;
    margin-top:12px;
  }
  .bar>i{
    display:block;height:100%;width:0%;
    background:var(--accent);
    border-radius:inherit;
    transition:width .5s var(--ease);
  }
  .bar-label{
    font-size:12px;
    color:var(--muted);
    margin-top:7px;
    font-variant-numeric:tabular-nums;
  }

  /* Composer */
  .composer{
    display:flex;
    gap:8px;
    padding:18px 24px 4px;
  }
  .composer input{
    flex:1;
    min-width:0;
    border:1px solid var(--line-strong);
    background:var(--surface-2);
    color:var(--ink);
    font:inherit;
    font-size:15px;
    padding:12px 14px;
    border-radius:10px;
    outline:none;
    transition:border-color .18s var(--ease), box-shadow .18s var(--ease);
  }
  .composer input::placeholder{color:var(--muted)}
  .composer input:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 3px var(--accent-soft);
  }
  .add{
    border:0;
    background:var(--accent);
    color:#fff;
    font:inherit;font-weight:600;font-size:15px;
    padding:0 18px;
    min-width:56px;
    border-radius:10px;
    cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;
    transition:filter .15s var(--ease), transform .08s var(--ease);
  }
  .add:hover{filter:brightness(1.06)}
  .add:active{transform:translateY(1px)}
  .add:disabled{background:var(--line-strong);color:var(--muted);cursor:not-allowed}
  .hint{
    padding:6px 24px 14px;
    font-size:12px;color:var(--muted);
  }
  .hint kbd{
    font:inherit;font-size:11px;
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:5px;
    padding:1px 5px;color:var(--ink-soft);
  }

  /* Toolbar */
  .tools{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:0 24px 14px;
    border-bottom:1px solid var(--line);
  }
  .filters{display:flex;gap:6px}
  .filters button{
    border:1px solid transparent;
    background:transparent;
    color:var(--ink-soft);
    font:inherit;font-size:13px;font-weight:500;
    padding:7px 12px;min-height:34px;
    border-radius:8px;cursor:pointer;
    transition:background .15s var(--ease),color .15s var(--ease);
  }
  .filters button:hover{background:var(--surface-2)}
  .filters button[aria-pressed="true"]{
    background:var(--accent-soft);color:var(--accent-ink);border-color:transparent;
  }
  .filters button .c{margin-left:5px;opacity:.6;font-variant-numeric:tabular-nums}
  .clear{
    border:0;background:transparent;color:var(--muted);
    font:inherit;font-size:13px;font-weight:500;
    padding:7px 8px;min-height:34px;border-radius:8px;cursor:pointer;
    transition:color .15s var(--ease),background .15s var(--ease);
  }
  .clear:hover:not(:disabled){color:var(--danger);background:var(--danger-soft)}
  .clear:disabled{opacity:.4;cursor:not-allowed}

  /* List */
  ul.list{
    list-style:none;margin:0;padding:8px;
    display:flex;flex-direction:column;gap:6px;
  }
  .item{
    display:flex;align-items:center;gap:12px;
    padding:10px 12px;
    background:var(--surface-2);
    border:1px solid transparent;
    border-radius:10px;
    cursor:grab;
    transition:background .15s var(--ease),border-color .15s var(--ease),opacity .2s var(--ease);
    animation:in .22s var(--ease);
  }
  @keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .item:hover{border-color:var(--line)}
  .item.dragging{opacity:.4;cursor:grabbing}
  .item.over{border-color:var(--accent);border-style:dashed}
  .item.done .text{text-decoration:line-through;color:var(--muted)}

  .check{position:relative;flex:0 0 auto;width:22px;height:22px;display:grid;place-items:center;cursor:pointer}
  .check input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
  .box{
    width:20px;height:20px;border-radius:6px;
    border:2px solid var(--line-strong);
    background:var(--surface);
    display:grid;place-items:center;
    transition:all .15s var(--ease);
  }
  .box svg{width:12px;height:12px;stroke:#fff;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;
    opacity:0;transform:scale(.5);transition:all .15s var(--ease)}
  .item.done .box{background:var(--accent);border-color:var(--accent)}
  .item.done .box svg{opacity:1;transform:scale(1)}
  .check:hover .box{border-color:var(--accent)}

  .body{flex:1;min-width:0}
  .text{
    font-size:15px;color:var(--ink);
    word-break:break-word;
  }
  .text[contenteditable="true"]{
    outline:none;border-radius:6px;
    box-shadow:0 0 0 3px var(--accent-soft);
    background:var(--surface);
  }
  .when{
    margin-top:2px;font-size:11.5px;color:var(--muted);
    display:none;gap:8px;font-variant-numeric:tabular-nums;
  }

  .del{
    flex:0 0 auto;width:32px;height:32px;border:0;border-radius:8px;
    background:transparent;color:var(--muted);cursor:pointer;
    display:grid;place-items:center;opacity:0;
    transition:opacity .15s var(--ease),background .15s var(--ease),color .15s var(--ease);
  }
  .item:hover .del,.del:focus-visible{opacity:1}
  .del:hover{background:var(--danger-soft);color:var(--danger)}
  .del svg{width:16px;height:16px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round}
  @media (hover:none){.del{opacity:1}}

  .grip{flex:0 0 auto;color:var(--line-strong);cursor:grab;display:grid;place-items:center;opacity:0;transition:opacity .15s}
  .item:hover .grip{opacity:1}
  .grip svg{width:14px;height:14px;fill:currentColor}
  @media (hover:none){.grip{display:none}}

  .empty{
    padding:44px 24px 48px;text-align:center;color:var(--muted);
  }
  .empty .big{font-size:15px;color:var(--ink-soft);font-weight:500}
  .empty .sub{font-size:13px;margin-top:6px}

  footer{
    padding:14px 24px;border-top:1px solid var(--line);
    font-size:12px;color:var(--muted);
    display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;
  }
  footer .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);display:inline-block;margin-right:6px;vertical-align:middle}

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>
  <main class="app" aria-label="Task list">
    <header class="head">
      <div class="row">
        <h1 id="title">Tasks</h1>
        <span class="date" id="date"></span>
      </div>
      <div class="meta" id="meta"></div>
      <div class="bar" aria-hidden="true"><i id="fill"></i></div>
      <div class="bar-label" id="barLabel"></div>
    </header>

    <form class="composer" id="form" autocomplete="off">
      <input type="text" id="new" placeholder="Add a task…  e.g. Call the dentist" aria-label="New task" maxlength="200" />
      <button type="submit" class="add" id="addBtn" aria-label="Add task">Add</button>
    </form>
    <div class="hint"><kbd>Enter</kbd> to add · double-click a task to edit · drag <span aria-hidden="true">⋮⋮</span> to reorder</div>

    <div class="tools">
      <div class="filters" role="group" aria-label="Filter tasks">
        <button data-f="all" aria-pressed="true">All <span class="c"></span></button>
        <button data-f="active" aria-pressed="false">Active <span class="c"></span></button>
        <button data-f="done" aria-pressed="false">Done <span class="c"></span></button>
      </div>
      <button class="clear" id="clearDone" disabled>Clear completed</button>
    </div>

    <ul class="list" id="list"></ul>
    <div class="empty" id="empty" hidden>
      <div class="big" id="emptyBig">Nothing here</div>
      <div class="sub" id="emptySub">Add your first task above.</div>
    </div>

    <footer>
      <span><span class="dot"></span>Auto-saved locally</span>
      <span id="footCount"></span>
    </footer>
  </main>

<script>
(function(){
  "use strict";
  var KEY="hermes.todos.v1";
  var state={items:[],filter:"all",seq:1};

  // ---- persistence
  function save(){
    try{localStorage.setItem(KEY,JSON.stringify({items:state.items,seq:state.seq}));}catch(e){}
  }
  function load(){
    var raw=null;
    try{raw=JSON.parse(localStorage.getItem(KEY));}catch(e){}
    if(raw&&Array.isArray(raw.items)){
      state.items=raw.items.map(function(it){
        it.id=it.id||("t"+Math.random().toString(36).slice(2,9));
        it.done=!!it.done;it.text=String(it.text||"");
        if(typeof it.created!=="number")it.created=Date.now();
        return it;
      });
      state.seq=raw.seq|| (state.items.reduce(function(m,i){return Math.max(m,i.id.slice(1)*1||0)},0)+1);
    }
  }

  // ---- dom
  var $list=document.getElementById("list");
  var $empty=document.getElementById("empty");
  var $emptyBig=document.getElementById("emptyBig");
  var $emptySub=document.getElementById("emptySub");
  var $form=document.getElementById("form");
  var $new=document.getElementById("new");
  var $addBtn=document.getElementById("addBtn");
  var $clear=document.getElementById("clearDone");
  var $fill=document.getElementById("fill");
  var $barLabel=document.getElementById("barLabel");
  var $meta=document.getElementById("meta");
  var $date=document.getElementById("date");
  var $foot=document.getElementById("footCount");
  var filterBtns=[].slice.call(document.querySelectorAll(".filters button"));

  // date
  var d=new Date();
  $date.textContent=new Intl.DateTimeFormat(undefined,{weekday:"long",month:"long",day:"numeric"}).format(d);

  function uid(){return "t"+(state.seq++);}

  // ---- render
  function render(){
    var total=state.items.length;
    var done=state.items.filter(function(i){return i.done}).length;
    var active=total-done;

    // header meta
    $meta.innerHTML= total===0
      ? "<span class=\"num\">0</span> tasks"
      : "<span class=\"num\">"+active+"</span> open · <span class=\"num\">"+done+"</span> done";

    var pct= total? Math.round(done/total*100):0;
    $fill.style.width=pct+"%";
    $barLabel.textContent= total? (done+" of "+total+" complete · "+pct+"%") : "No tasks yet";

    $foot.textContent= total? (total+" task"+(total>1?"s":"")) : "";

    // filter counts
    filterBtns.forEach(function(b){
      var f=b.getAttribute("data-f");
      var n = f==="all"?total : f==="active"?active : done;
      b.querySelector(".c").textContent=n;
    });
    $clear.disabled=done===0;

    var view=state.items.filter(function(i){
      return state.filter==="all" || (state.filter==="active"&&!i.done) || (state.filter==="done"&&i.done);
    });

    $list.innerHTML="";
    view.forEach(function(it){ $list.appendChild(build(it)); });

    var showEmpty = total===0 || view.length===0;
    $empty.hidden=!showEmpty;
    if(showEmpty){
      if(total===0){$emptyBig.textContent="Nothing here";$emptySub.textContent="Add your first task above.";}
      else{
        $emptyBig.textContent="No "+state.filter+" tasks";
        $emptySub.textContent = state.filter==="done" ? "Complete something and it will appear here." : "All caught up — nice work.";
      }
    }
  }

  function build(it){
    var li=document.createElement("li");
    li.className="item"+(it.done?" done":"");
    li.draggable=true;
    li.dataset.id=it.id;

    var grip=document.createElement("span");
    grip.className="grip";grip.setAttribute("aria-hidden","true");
    grip.innerHTML='<svg viewBox="0 0 16 16"><circle cx="4" cy="3" r="1.3"/><circle cx="4" cy="8" r="1.3"/><circle cx="4" cy="13" r="1.3"/><circle cx="11" cy="3" r="1.3"/><circle cx="11" cy="8" r="1.3"/><circle cx="11" cy="13" r="1.3"/></svg>';

    var check=document.createElement("label");
    check.className="check";
    check.innerHTML='<input type="checkbox" '+(it.done?"checked":"")+' aria-label="Mark done"><span class="box"><svg viewBox="0 0 24 24"><polyline points="4 12.5 10 18.5 20 6.5"/></svg></span>';
    var cb=check.querySelector("input");
    cb.addEventListener("change",function(){it.done=cb.checked;render();save();});

    var body=document.createElement("div");
    body.className="body";
    var text=document.createElement("span");
    text.className="text";text.textContent=it.text;
    body.appendChild(text);
    var when=document.createElement("div");
    when.className="when";
    when.textContent="Added "+new Intl.DateTimeFormat(undefined,{day:"numeric",month:"short"}).format(new Date(it.created));
    body.appendChild(when);

    var del=document.createElement("button");
    del.className="del";del.setAttribute("aria-label","Delete task");
    del.innerHTML='<svg viewBox="0 0 24 24"><path d="M5 7h14M9 7V5a2 2 0 012-2h2a2 2 0 012 2v2m-8 0 1 12a2 2 0 002 2h4a2 2 0 002-2l1-12"/></svg>';
    del.addEventListener("click",function(){it._leaving=true;li.style.opacity="0";li.style.transform="scale(.96)";setTimeout(function(){remove(it.id);},160);});

    li.appendChild(grip);li.appendChild(check);li.appendChild(body);li.appendChild(del);
    li.addEventListener("dragstart",onDragStart);
    li.addEventListener("dragover",onDragOver);
    li.addEventListener("dragleave",onDragLeave);
    li.addEventListener("drop",onDrop);
    li.addEventListener("dragend",onDragEnd);
    return li;
  }

  // inline edit
  document.addEventListener("dblclick",function(e){
    var t=e.target.closest(".text");
    if(!t||t.contentEditable==="true")return;
    t.contentEditable="true";t.focus();
    var range=document.createRange();range.selectNodeContents(t);
    var sel=getSelection();sel.removeAllRanges();sel.addRange(range);
    var done=false;
    function finish(save){
      if(done)return;done=true;
      var li=t.closest(".item");var id=li.dataset.id;
      var nv=t.textContent.trim();
      t.contentEditable="false";
      if(save&&nv){var it=byId(id);if(it){it.text=nv;t.textContent=nv;save();}}
      else{t.textContent=byId(id).text;}
      render();
    }
    t.addEventListener("keydown",function(ev){
      if(ev.key==="Enter"){ev.preventDefault();finish(true);}
      else if(ev.key==="Escape"){finish(false);}
    });
    t.addEventListener("blur",function(){finish(true);});
  });

  // ---- helpers
  function byId(id){for(var i=0;i<state.items.length;i++)if(state.items[i].id===id)return state.items[i];return null;}
  function remove(id){state.items=state.items.filter(function(i){return i.id!==id;});render();save();}

  // ---- drag reorder
  var dragEl=null;
  function onDragStart(e){dragEl=this;this.classList.add("dragging");e.dataTransfer.effectAllowed="move";try{e.dataTransfer.setData("text/plain",this.dataset.id);}catch(_){}}
  function onDragOver(e){
    e.preventDefault();
    e.dataTransfer.dropEffect="move";
    var after=getAfter(this,e.clientY);
    if(after==null)$list.appendChild(this);
    else $list.insertBefore(this,after);
    this.classList.add("over");
  }
  function onDragLeave(){this.classList.remove("over");}
  function onDrop(e){e.preventDefault();this.classList.remove("over");persistOrder();}
  function onDragEnd(){if(this) this.classList.remove("dragging");persistOrder();}
  function getAfter(el,y){
    var els=[].slice.call($list.querySelectorAll(".item:not(.dragging)"));
    var closest=null,bd=-Infinity;
    els.forEach(function(c){
      var box=c.getBoundingClientRect();
      var off=y-box.top-box.height/2;
      if(off<0&&off>bd){bd=off;closest=c;}
    });
    return closest;
  }
  function persistOrder(){
    var order=[].slice.call($list.querySelectorAll(".item")).map(function(el){return el.dataset.id;});
    // reorder state to match visible order within current filter
    var items={};state.items.forEach(function(i){items[i.id]=i;});
    var rest=[];
    order.forEach(function(id){if(items[id]){rest.push(items[id]);delete items[id];}});
    Object.keys(items).forEach(function(id){rest.push(items[id]);});
    state.items=rest;
    save();
  }

  // ---- composer
  $form.addEventListener("submit",function(e){
    e.preventDefault();
    var v=$new.value.trim();
    if(!v)return;
    var it={id:uid(),text:v,done:false,created:Date.now()};
    state.items.unshift(it);
    $new.value="";
    render();save();
    $new.focus();
  });

  // filters
  filterBtns.forEach(function(b){
    b.addEventListener("click",function(){
      state.filter=b.getAttribute("data-f");
      filterBtns.forEach(function(x){x.setAttribute("aria-pressed",String(x===b));});
      render();
    });
  });

  $clear.addEventListener("click",function(){
    state.items=state.items.filter(function(i){return !i.done;});
    render();save();
  });

  // ---- boot
  load();
  render();
  $new.focus();
})();
</script>
</body>
</html>
